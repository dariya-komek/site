<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Спасибо за помощь Дарие</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { margin: 0; min-height: 100vh; background: #1a1a2e; color: #fff; font-family: 'Open Sans', sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
    .thanks { max-width: 440px; width: 100%; text-align: center; }
    .thanks img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; object-position: center 20%;
      border: 4px solid #8bb650; margin-bottom: 20px; }
    .thanks h1 { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 26px; line-height: 1.25; margin: 0 0 14px; }
    .thanks .paid { color: #b5e06a; font-weight: 600; font-size: 17px; margin: 0 0 14px; }
    .thanks p { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.8); margin: 0 0 24px; }
    .thanks .share { display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px;
      background: #25d366; color: #fff; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; }
    .thanks .back { display: inline-block; margin-top: 18px; color: rgba(255,255,255,0.7); font-size: 14px; }
  </style>
  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1085446607804654');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1085446607804654&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <div class="thanks">
    <img src="img/img1.jpeg" alt="Дария" />
    <h1>Спасибо, что помогли Дарие!</h1>
    <div class="paid" id="paid" hidden></div>
    <p>Каждый тенге приближает Дарию к выздоровлению. Поделитесь сайтом с близкими — это тоже большая помощь.</p>
    <a class="share" href="https://wa.me/?text=%D0%9F%D0%BE%D0%BC%D0%BE%D0%B3%D0%B8%D1%82%D0%B5%20%D0%94%D0%B0%D1%80%D0%B8%D0%B5%2C%20%D0%B5%D0%B9%202%20%D0%B3%D0%BE%D0%B4%D0%B0%2C%20%D0%BD%D0%B5%D0%B9%D1%80%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D0%BE%D0%BC%D0%B0%204%20%D1%81%D1%82%D0%B0%D0%B4%D0%B8%D0%B8.%20%D0%9E%D1%81%D1%82%D0%B0%D0%BB%D0%BE%D1%81%D1%8C%20%D0%B2%D1%81%D0%B5%D0%B3%D0%BE%202%20%D0%BA%D1%83%D1%80%D1%81%D0%B0%20%D1%82%D0%B5%D1%80%D0%B0%D0%BF%D0%B8%D0%B8%3A%20https%3A//dariyakomek.kz/" target="_blank" rel="noopener">Поделиться в WhatsApp</a>
    <a class="back" href="./">Вернуться на сайт</a>
  </div>
  <script>
    // Событие оплаты для пикселя отправляем, только если сервер подтвердил оплату, и один раз на платёж
    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) return;
      try {
        const resp = await fetch('https://dariyakomek.kz/api/donate/status?id=' + encodeURIComponent(id), { cache: 'no-store' });
        const data = await resp.json();
        if (data.status !== 'paid' || !data.amount) return;
        const el = document.getElementById('paid');
        el.textContent = 'Ваш платёж ' + data.amount.toLocaleString('ru-RU') + ' ₸ получен';
        el.hidden = false;
        const key = 'donate-tracked-' + id;
        if (localStorage.getItem(key)) return;
        localStorage.setItem(key, '1');
        if (window.fbq) fbq('track', 'Purchase', { value: data.amount, currency: 'KZT' }, { eventID: 'donate-' + id });
      } catch (e) {}
    })();
  </script>
</body>
</html>
